<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broker Tycoon 123Credit</title>
<!--
  Broker Tycoon 123Credit v2 — joc idle arcade pentru laptop, un singur fișier.

  CE SE EDITEAZĂ
  - CONFIG.CTA_URL  linkul spre recrutare (partners.123credit.ro), folosit de "Devino broker" și de popup-ul final
  - CONFIG.END_AFTER_HUB  cât mai joacă după ce devine Hub Manager, înainte de popup-ul de recrutare
  - BANKS           lista partenerilor, cu logo-urile din caruselele de pe 123credit.ro (26) și 123leasing.ro (15).
                    Logo-urile sunt încorporate în fișier (LOGO_DATA, PNG în base64).
  - PRODUCTS / UNLOCK_AT  produsele, comisionul lor (unități de joc, în €) și câte dosare deblochează fiecare
  - UPS             upgrade-urile de pe platforme
  - CONFIG          ritmul jocului (scanare, clienți, viteze, salariul asistenților)

  PARAMETRI DE TEST în URL
  ?skip=1  sare peste ecranul cu numele      ?bot=1  un bot joacă singur
  ?speed=4 timpul curge mai repede           ?debug=1  expune window.__state() și window.__tick(secunde)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#02831C;--deep:#04380f;--yellow:#FF9800}
  html,body{margin:0;height:100%;background:#03450f;overflow:hidden;font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:radial-gradient(ellipse at 50% 30%,rgba(2,131,28,.88),rgba(3,40,12,.96));backdrop-filter:blur(6px)}
  #intro.hide{display:none}
  .card{width:min(460px,90vw);box-sizing:border-box;padding:36px 36px 28px;border-radius:24px;text-align:center;color:#fff;
    background:linear-gradient(180deg,#046f19,#04380f);border:2px solid rgba(255,152,0,.7);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .card img{height:52px;display:block;margin:0 auto 18px}
  .card h1{margin:0 0 8px;font:800 34px/1.1 'Encode Sans','Inter',sans-serif}
  .card h1 span{color:var(--yellow)}
  .card p{margin:0 0 24px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)}
  .card label{display:block;margin-bottom:8px;font-weight:700;font-size:14px;text-align:left}
  .card input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.28);color:#fff;font:700 18px 'Inter',sans-serif;outline:none;-webkit-user-select:text;user-select:text}
  .card input:focus{border-color:var(--yellow)}
  .card input::placeholder{color:rgba(255,255,255,.4);font-weight:500}
  .card button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:999px;background:var(--yellow);color:var(--deep);
    font:800 18px 'Encode Sans','Inter',sans-serif;cursor:pointer;box-shadow:0 4px 0 #a85f00}
  .card button:hover{filter:brightness(1.06)}
  .card button:active{transform:translateY(2px);box-shadow:0 2px 0 #a85f00}
  .card small{display:block;margin-top:18px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.65)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <div class="card">
    <img id="introLogo" alt="123Credit">
    <h1>Broker <span>Tycoon</span></h1>
    <p>Duci dosarele clienților la portofoliul de parteneri, află ce bancă aprobă și strânge comisionul plătit de bancă.</p>
    <label for="nm">Cum te cheamă?</label>
    <input id="nm" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Numele tău">
    <button id="go" type="button">Începe jocul</button>
    <small>Te miști cu săgețile sau WASD, ori ții apăsat cu mouse-ul. Pauză cu tasta P.</small>
  </div>
</div>

/* ───────────── LOGICA ───────────── */
function tileC(i){const p=tilePos(i);return{x:p.x+GRID.tw/2,y:p.y+GRID.th/2}}
const cashC=()=>({x:CASH.x+CASH.w/2,y:CASH.y+CASH.h/2});
const zoneC=()=>({x:ZONE.x+ZONE.w/2,y:ZONE.y+ZONE.h/2});

function stepTo(o,tx,ty,sp,dt){
  const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<2){o.mv=0;return d}
  const m=Math.min(d,sp*dt);o.x+=dx/d*m;o.y+=dy/d*m;o.mv=1;if(Math.abs(dx)>1)o.face=dx>0?1:-1;return d-m;
}

function spawnClient(){
  const free=[];G.mats.forEach((m,i)=>{if(!m)free.push(i)});if(!free.length)return;
  const mi=pick(free);
  const pool=G.unlocked.slice();pool.push(G.unlocked[G.unlocked.length-1]);
  const c={id:G.cid++,x:DOOR.x+rand(-24,24),y:DOOR.y,need:pick(pool),mat:mi,state:'enter',taken:false,approved:false,res:null,t:0,
    look:randLook(),ph:Math.random()*6,mv:1,face:1,bank:null,by:'player'};
  G.mats[mi]=c;G.clients.push(c);
}
function updClients(dt){
  G.spawn-=dt;
  if(G.spawn<=0){G.spawn=Math.max(CONFIG.SPAWN_MIN,CONFIG.SPAWN_START-.15*G.delivered-.3*G.assist.length);spawnClient()}
  G.clients=G.clients.filter(c=>{
    if(c.state==='enter'){const m=MATS[c.mat];if(stepTo(c,m.x,m.y,82,dt)<2){c.state='wait';c.mv=0}}
    else if(c.state==='happy'){c.t+=dt;c.mv=0;if(c.t>1.6){c.state='leave';G.mats[c.mat]=null}}
    else if(c.state==='leave'){if(stepTo(c,DOOR.x,DOOR.y,92,dt)<4)return false}
    return true;
  });
}

function takeDosar(owner,c,by){
  owner.stack.push({need:c.need,c});c.taken=true;c.res=null;c.by=by;
  fly('folder',c.x,c.y+HEAD,owner.x,owner.y+HEAD-24,.5,0,30,null,PRODUCTS[c.need].col);
  sfx('pick');
}
function dropDosar(owner){
  const it=owner.stack.pop();if(!it)return;
  G.queue.push(it.c);
  fly('folder',owner.x,owner.y+HEAD-24,SCANNER.x,SCANNER.y+10,.55,0,44,null,PRODUCTS[it.need].col);
  sfx('drop');
}

function updHub(dt){
  G.tiles.forEach(t=>{if(t.p<1)t.p=Math.min(1,t.p+dt/.4)});
  if(G.hubPhase==='idle'){
    if(G.queue.length){G.cur=G.queue.shift();G.hubPhase='scan';G.hubT0=0;G.scanIdx=0;G.tiles=tilesFresh();G.win=-1}
  } else if(G.hubPhase==='scan'){
    G.hubT0+=dt;const N=BANKS.length,sup=SUP[G.cur.need];
    const idx=Math.min(N,Math.floor(G.hubT0/G.hubT*N*1.02));
    while(G.scanIdx<idx){const i=G.scanIdx++;const t=G.tiles[i];t.st=sup[i]?'ok':'no';t.p=0;if(i%6===0)sfx('tick')}
    if(G.hubT0>=G.hubT)finishScan();
  } else if(G.hubPhase==='hold'){
    G.hubT0+=dt;
    if(G.hubT0>=CONFIG.HOLD_SECONDS&&(G.queue.length||G.hubT0>=CONFIG.HOLD_SECONDS+2.2)){G.hubPhase='idle';G.cur=null;G.tiles=tilesFresh();G.win=-1}
  }
}
function finishScan(){
  const c=G.cur,sup=SUP[c.need],oks=[];sup.forEach((v,i)=>{if(v)oks.push(i)});
  G.win=pick(oks);G.tiles.forEach((t,i)=>{if(t.st==='idle'){t.st=sup[i]?'ok':'no';t.p=0}});G.scanIdx=BANKS.length;G.tiles[G.win].st='win';G.tiles[G.win].p=0;
  G.hubPhase='hold';G.hubT0=0;G.delivered++;
  c.approved=true;c.bank=BANKS[G.win];c.state='happy';c.t=0;c.mv=0;
  const pay=PRODUCTS[c.need].pay,tc=tileC(G.win),cc=cashC(),n=clamp(Math.round(pay/2.4),3,6),base=Math.floor(pay/n);let rem=pay-base*n;
  for(let k=0;k<n;k++){const v=base+(rem-->0?1:0);fly('bill',tc.x,tc.y+GRID.th/2-2,cc.x+rand(-22,22),cc.y+rand(-10,10),1.0,.3+k*.22,80,()=>{G.pile+=v})}
  floatTxt(cc.x,CASH.y+CASH.h+34,'+€'+pay,'#0e7a30',20);
  if(c.by==='assistant'&&G.bonusPer>0){
    const b=G.bonusPer;fly('coin',SCANNER.x+40,SCANNER.y,cc.x+34,cc.y,1.0,n*.22+.5,70,()=>{G.pile+=b});
    floatTxt(cc.x,CASH.y+CASH.h+76,'+€'+b+' bonus de hub','#a85f00',15);
  }
  sfx('ok');
  if(G.step===1)G.step=2;
  checkUnlock();
}

function checkUnlock(){
  const i=G.unlocked.length;if(i>=PORDER.length)return;
  const k=PORDER[i];if(G.delivered>=UNLOCK_AT[k]){G.unlocked.push(k);G.slotGlow[i]=4;celebrate({kind:'product',key:k,title:PRODUCTS[k].name,sub:PRODUCTS[k].sub,top:'NIVEL '+G.unlocked.length,slot:i})}
}
function celebrate(o){o.t=0;o.freeze=2.8;o.total=3.7;if(G.cel)G.celQ.push(o);else{G.cel=o;startCel()}}
function startCel(){sfx('level');burst(640,330,46,1.1)}

function collectCash(dt,rate){
  if(G.pile<=0.01)return 0;
  const d=Math.min(G.pile,rate*dt);G.pile-=d;G.money+=d;G.earned+=d;
  G.coinT-=dt;if(G.coinT<=0){G.coinT=.16;const cc=cashC();fly('coin',cc.x+rand(-24,24),cc.y,440,32,.7,0,60,null);sfx('cash')}
  return d;
}

function updPlayer(dt,vec){
  const p=G.p;
  p.x=clamp(p.x+vec.x*G.speed*dt,30,W-30);p.y=clamp(p.y+vec.y*G.speed*dt,MINY,712);
  p.mv=Math.hypot(vec.x,vec.y)>.05?1:0;if(Math.abs(vec.x)>.1)p.face=vec.x>0?1:-1;if(p.mv)G.moved=true;
  G.pickT-=dt;G.dropT-=dt;
  if(G.pickT<=0&&p.stack.length<G.cap){
    for(const c of G.clients){if(c.state==='wait'&&!c.taken&&dist(p,c)<58){takeDosar(p,c,'player');G.pickT=.3;if(G.step===0)G.step=1;break}}
  }
  if(G.dropT<=0&&p.stack.length&&inRect(p,ZONE)){dropDosar(p);G.dropT=.22}
  if(inRect(p,CASH)){const d=collectCash(dt,18);if(d>0&&G.step===2)G.step=3}
  G.slots.forEach((ui,s)=>{
    if(ui==null)return;const u=G.ups[ui];
    if(!p.mv&&inRect(p,PADS[s])&&G.money>0.01){
      const d=Math.min(G.money,u.cost-u.prog,22*dt);G.money-=d;u.prog+=d;
      G.coinT-=dt;if(G.coinT<=0){G.coinT=.2;fly('coin',440,32,PADS[s].x+PADS[s].w/2,PADS[s].y+PADS[s].h/2,.6,0,50,null)}
      if(u.prog>=u.cost-.001)buyUp(s);
    }
  });
}
function buyUp(s){
  const ui=G.slots[s],u=G.ups[ui];u.prog=u.cost;u.bought=true;u.fn(G);G.bought++;
  const r=PADS[s];burst(r.x+r.w/2,r.y+r.h/2,16,.8);toast(u.toast);sfx('up');
  G.slots[s]=G.nextUp<G.ups.length?G.nextUp++:null;G.padPop[s]=.6;
  if(G.step===3)G.step=4;
}
function addAssist(){
  const n=G.assist.length,sp=IDLE[n]||IDLE[0];
  const a={x:DOOR.x,y:DOOR.y-10,spot:sp,stack:[],cap:3,mode:'idle',mv:1,ph:Math.random()*6,face:1,pt:0,look:{skin:pick(SKINS),hair:pick(HAIRS)},think:0};
  G.assist.push(a);
  if(G.assist.length===3&&!G.hubMgr){G.hubMgr=true;G.bonusPer=1;G.roleGlow=5;celebrate({kind:'promo',title:'Hub Manager',top:'PROMOVARE',sub:'Felicitări, '+G.name+'! Primești un bonus din munca asistenților tăi.',slot:-1})}
  if(G.assist.length===5){G.bonusPer=2;toast('Bonusul de hub s-a dublat')}
}
function freeClients(a){return G.clients.filter(c=>c.state==='wait'&&!c.taken&&(!c.res||c.res===a))}
function updAssist(a,dt){
  a.pt-=dt;a.think-=dt;
  const sp=CONFIG.ASSIST_SPEED,z=zoneC(),cc=cashC();
  if(a.mode==='idle'){
    stepTo(a,a.spot.x,a.spot.y,sp,dt);
    if(a.think<=0){a.think=.5;
      if(freeClients(a).length&&a.stack.length<a.cap)a.mode='fetch';
      else if(G.pile>=3&&!G.cashBy){a.mode='cash';G.cashBy=a}}
  } else if(a.mode==='fetch'){
    let tgt=null,bd=1e9;for(const c of freeClients(a)){const d=dist(a,c);if(d<bd){bd=d;tgt=c}}
    if(a.stack.length>=a.cap||(!tgt&&a.stack.length>0)){a.mode='deliver';return}
    if(!tgt){a.mode='idle';return}
    if(tgt.res!==a){tgt.res=a;a.side=a.x<tgt.x?-1:1}
    const d=stepTo(a,tgt.x+a.side*54,tgt.y+4,sp,dt);
    if(d<12&&a.pt<=0){takeDosar(a,tgt,'assistant');a.pt=.4}
  } else if(a.mode==='deliver'){
    const slot=(G.assist.indexOf(a)-1)*84;           // fiecare asistent își are locul lui în zonă
    stepTo(a,z.x+slot,z.y+16,sp,dt);
    if(inRect(a,ZONE)){a.mv=0;
      if(a.stack.length&&a.pt<=0){dropDosar(a);a.pt=.28}
      if(!a.stack.length){if(G.pile>=3&&!G.cashBy){a.mode='cash';G.cashBy=a}else a.mode='idle'}}
  } else if(a.mode==='cash'){
    const d=stepTo(a,cc.x,cc.y+16,sp,dt);
    if(inRect(a,CASH)||d<8){
      const amt=G.pile;
      if(amt>0.01){
        const cut=Math.max(amt>=1?1:0,Math.round(amt*CONFIG.ASSIST_CUT));
        G.pile=0;G.money+=amt-cut;G.earned+=amt-cut;G.salaries+=cut;
        fly('coin',cc.x,cc.y,440,32,.8,0,60,()=>{});sfx('cash');
        floatTxt(a.x,a.y+34,'Salariu asistent €'+cut,'#6b5a2a',14);
      }
      G.cashBy=null;a.mode='idle';a.think=.6;
    }
  }
}

const keys={};let joy=null;
function toLogical(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function openCTA(){
  try{ if(window.mraid&&window.mraid.open){window.mraid.open(CONFIG.CTA_URL);return}
       if(window.ExitApi&&window.ExitApi.exit){window.ExitApi.exit();return} }catch(e){}
  window.open(CONFIG.CTA_URL,'_blank','noopener');
}
function setPause(v){if(G.mode!=='play'||G.over)return;G.paused=v;joy=null;G.target=null;if(v)for(const k in keys)delete keys[k]}
function restart(){const n=G.name;newGame(n);G.mode='play'}
addEventListener('keydown',e=>{
  if(G.mode==='intro')return;
  const k=e.key.toLowerCase();unlockAudio();
  if(G.over){if(k==='enter')openCTA();return}
  if(k==='p'||k==='escape'){setPause(!G.paused);e.preventDefault();return}
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(G.paused)return;
  keys[k]=1;G.target=null;
});
addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
if(!CONFIG.DEBUG){
  addEventListener('blur',()=>setPause(true));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
}
cv.addEventListener('pointerdown',e=>{
  unlockAudio();const p=toLogical(e);
  if(G.mode!=='play')return;
  if(G.over){
    if(hit(END.cta,p))openCTA();
    else if(hit(END.again,p))restart();
    return;
  }
  if(G.paused){
    if(hit(PAUSE.go,p))setPause(false);
    else if(hit(PAUSE.cta,p))openCTA();
    else if(hit(PAUSE.again,p))restart();
    return;
  }
  if(hit(BTN.cta,p)){openCTA();return}
  if(hit(BTN.snd,p)){muted=!muted;return}
  if(hit(BTN.pause,p)){setPause(true);return}
  if(e.pointerType==='mouse'){G.target={x:clamp(p.x,30,W-30),y:clamp(p.y,MINY,712),held:true};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else{joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const p=toLogical(e);
  if(G.target&&G.target.held&&e.pointerType==='mouse'){G.target.x=clamp(p.x,30,W-30);G.target.y=clamp(p.y,MINY,712)}
  if(joy&&e.pointerId===joy.id){joy.x=p.x;joy.y=p.y;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),R=70;if(d>R){joy.ox+=dx/d*(d-R);joy.oy+=dy/d*(d-R)}}
});
const upFn=e=>{if(joy&&e.pointerId===joy.id)joy=null;if(G.target)G.target.held=false};
cv.addEventListener('pointerup',upFn);cv.addEventListener('pointercancel',upFn);

function inputVec(){
  if(CONFIG.BOT)return botVec();
  let x=0,y=0;
  if(keys.arrowleft||keys.a)x-=1;if(keys.arrowright||keys.d)x+=1;if(keys.arrowup||keys.w)y-=1;if(keys.arrowdown||keys.s)y+=1;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),R=70;if(d>10){const m=Math.min(1,d/R);x=dx/d*m;y=dy/d*m}}
  if(!x&&!y&&G.target){const dx=G.target.x-G.p.x,dy=G.target.y-G.p.y,d=Math.hypot(dx,dy);if(d>6){x=dx/d;y=dy/d}else if(!G.target.held)G.target=null}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y};
}

/* ───────────── BOT (doar pentru teste) ───────────── */
function botVec(){
  const p=G.p,un=G.clients.filter(c=>c.state==='wait'&&!c.taken),zc=zoneC(),cc=cashC();
  const rem=s=>{const ui=G.slots[s];return ui==null?1e9:G.ups[ui].cost-G.ups[ui].prog};
  const aff=[0,1].filter(s=>rem(s)<=G.money+.001);
  let t;
  if(aff.length){const r=PADS[aff[0]];t={x:r.x+r.w/2,y:r.y+r.h/2}}
  else if(p.stack.length&&(p.stack.length>=G.cap||!un.length||inRect(p,ZONE))){t=zc}
  else if(!G.assist.length&&G.pile>=6&&!p.stack.length){t=cc}
  else if(un.length&&p.stack.length<G.cap){let b=null,bd=1e9;un.forEach(c=>{const d=dist(p,c);if(d<bd){bd=d;b=c}});t={x:b.x,y:b.y+12}}
  else if(!G.assist.length&&G.pile>=1){t=cc}
  else t={x:640,y:560};
  const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy);return d<8?{x:0,y:0}:{x:dx/d,y:dy/d};
}

/* ───────────── UPDATE ───────────── */
function celStep(dt){
  const c=G.cel;c.t+=dt;
  if(c.t>=c.total){G.cel=G.celQ.shift()||null;if(G.cel)startCel()}
}
function step(dt){
  G.shown+=(G.money-G.shown)*Math.min(1,dt*6);
  G.shake=Math.max(0,G.shake-dt);
  G.padPop=G.padPop.map(v=>Math.max(0,v-dt));
  G.slotGlow=G.slotGlow.map(v=>Math.max(0,v-dt));G.roleGlow=Math.max(0,G.roleGlow-dt);
  if(G.mode!=='play'||G.paused)return;
  if(G.over){G.endT+=dt;updFx(dt);return}
  updFx(dt);
  if(G.cel){celStep(dt);if(G.cel&&G.cel.t<G.cel.freeze)return}
  G.t+=dt;if(G.toast)G.toast.t+=dt;
  updClients(dt);
  updPlayer(dt,inputVec());
  G.assist.forEach(a=>updAssist(a,dt));
  updHub(dt);
  if(G.hubMgr&&!G.cel){G.afterHub+=dt;if(G.afterHub>=CONFIG.END_AFTER_HUB)endGame()}
}
function endGame(){
  if(G.over)return;
  G.over=true;G.endT=0;joy=null;G.target=null;G.paused=false;sfx('level');
  for(let i=0;i<80;i++)G.fx.push({k:'conf',x:rand(0,W),y:rand(-120,20),vx:rand(-40,40),vy:rand(60,200),rot:rand(0,7),vr:rand(-8,8),col:pick([C.yellow,'#fff','#7be5a0','#ffd54a']),life:rand(2.4,4),t:0});
}

function drawLogo(b,w,h,alpha){
  const im=LOGOIMG[b.logo];
  ctx.globalAlpha=alpha;
  if(im&&im.complete&&im.naturalWidth){
    const bw=w-11,bh=h-6,s=Math.min(bw/im.naturalWidth,bh/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
    ctx.imageSmoothingQuality='high';ctx.drawImage(im,Math.round((w-dw)/2),Math.round((h-dh)/2),Math.round(dw),Math.round(dh));
  } else fitTxt(b.s,w/2,h/2+1,w-14,13,'#12301a','800','center');
  ctx.globalAlpha=1;
}
function drawWall(){
  const N=BANKS.length,scanning=G.hubPhase!=='idle';
  BANKS.forEach((b,i)=>{
    const t=G.tiles[i],pos=tilePos(i),x=Math.round(pos.x),y=Math.round(pos.y),w=Math.round(GRID.tw),h=Math.round(GRID.th);
    const e=easeInOut(t.p),res=scanning&&t.st!=='idle',no=res&&t.st==='no',ok=res&&(t.st==='ok'||t.st==='win');
    const win=scanning&&t.st==='win',chk=G.hubPhase==='scan'&&i===G.scanIdx;
    ctx.save();
    if(win){const s=1+.06*easeOutBack(Math.min(1,G.hubT0*1.6));ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);ctx.translate(-w/2,-h/2)}else ctx.translate(x,y);
    rr(0,0,w,h,8);ctx.fillStyle=no?mix('#ffffff','#d9d6cc',e):'#ffffff';ctx.fill();

    if(win||chk){rr(1.5,1.5,w-3,h-3,7);ctx.lineWidth=win?4:3;ctx.strokeStyle=C.yellow;ctx.stroke()}
    if(ok){const r=win?8:6.5;ctx.globalAlpha=e;ctx.fillStyle=win?C.yellow:'#23a04c';ctx.beginPath();ctx.arc(w-4,4,r,0,7);ctx.fill();icon('check',w-4,4,r*.62,win?'#04380f':'#fff');ctx.globalAlpha=1}

    txt('Comparăm '+N+' de parteneri pentru '+PRODUCTS[G.cur.need].label,VERD.x+50,VERD.y+17.5,15,'#fff','700','left','middle');
    txt(Math.min(G.scanIdx,N)+' din '+N,VERD.x+VERD.w-16,VERD.y+17.5,13,'rgba(255,255,255,.8)','700','right','middle');
  } else if(done){
    icon('check',VERD.x+26,VERD.y+17,9,'#fff');
    txt('Aprobat la '+BANKS[G.win].n,VERD.x+50,VERD.y+17.5,18,'#fff','800','left','middle',true);
    txt(PRODUCTS[G.cur.need].label,VERD.x+VERD.w-16,VERD.y+17.5,14,'rgba(255,255,255,.9)','700','right','middle');
  } else {
    txt('Duci dosarele la analiză și afli ce bancă le aprobă',VERD.x+VERD.w/2,VERD.y+17.5,15,'rgba(255,255,255,.72)','600','center','middle');
  }
}

function drawEntities(){

  if(G.step===0){s='Mută-te la un client și ia dosarul lui. Folosește săgețile, WASD sau mouse-ul.';
    if(un.length){let b=un[0],bd=1e9;un.forEach(c=>{const d=dist(G.p,c);if(d<bd){bd=d;b=c}});tx={x:b.x,y:b.y+HEAD-44}}}

function drawCelebration(){

  const dim=(1-out)*clamp(t/.3,0,1)*.55;ctx.fillStyle='rgba(2,24,8,'+dim+')';ctx.fillRect(0,64,W,H-64);
  // raze
  if(out<1){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.12);ctx.globalAlpha=(1-out)*clamp(t/.6,0,1)*.09;ctx.fillStyle='#ffd54a';
    for(let i=0;i<10;i++){ctx.rotate(Math.PI*2/10);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(520,-46);ctx.lineTo(520,46);ctx.closePath();ctx.fill()}ctx.restore()}
  // cartela zboară spre HUD
  let tx=cx,ty=cy,sc=easeOutBack(inT)*.999;
  if(out>0){const e=easeInOut(out);const dest=c.slot>=0?SLOT(c.slot):{x:284,y:32};tx=lerp(cx,dest.x,e);ty=lerp(cy,dest.y,e);sc=lerp(1,.06,e)}
  ctx.save();ctx.translate(tx,ty);ctx.scale(Math.max(.01,sc),Math.max(.01,sc));ctx.globalAlpha=clamp(inT*1.4,0,1)*(out>.8?1-(out-.8)/.2:1);
  const w=620,h=176;
  shadowed(()=>{rr(-w/2,-h/2,w,h,28);const gr=ctx.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'#05a024');gr.addColorStop(1,'#04520f');ctx.fillStyle=gr;ctx.fill()},30,10,.4);
  rr(-w/2,-h/2,w,h,28);ctx.lineWidth=4;ctx.strokeStyle=C.yellow;ctx.stroke();
  // titlu mic
  const tw=measure(c.top,14,'800',true)+36;rr(-tw/2,-h/2-15,tw,30,15);ctx.fillStyle=C.yellow;ctx.fill();txt(c.top,0,-h/2+1,14,'#04380f','800','center','middle',true);
  // disc cu icon
  const col=c.kind==='product'?PRODUCTS[c.key].col:C.yellow,ic=c.kind==='product'?PRODUCTS[c.key].icon:'crown';
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(-w/2+104,4,56,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(-w/2+104,0,52,0,7);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();
  icon(ic,-w/2+104,0,27,c.kind==='product'?'#fff':'#04380f');
  const subLines=c.sub.length>46?2:1;
  fitTxt(c.title,-w/2+190,subLines===2?-34:-20,w-226,36,'#fff','800','left',true);
  wrap(c.sub,-w/2+190,subLines===2?4:20,w-230,26,18,'rgba(255,255,255,.92)','600','left');
  ctx.restore();
}
function drawPause(){
  ctx.fillStyle='rgba(2,24,8,.72)';ctx.fillRect(0,0,W,H);
  const c=PAUSE.card;
  shadowed(()=>{rr(c.x,c.y,c.w,c.h,26);const gr=ctx.createLinearGradient(0,c.y,0,c.y+c.h);gr.addColorStop(0,'#05851d');gr.addColorStop(1,'#04380f');ctx.fillStyle=gr;ctx.fill()},30,10,.4);
  rr(c.x,c.y,c.w,c.h,26);ctx.lineWidth=3;ctx.strokeStyle=C.yellow;ctx.stroke();
  txt('Pauză',640,c.y+58,36,'#fff','800','center','alphabetic',true);
  txt(G.name+' · '+(G.hubMgr?'Hub Manager':'Broker'),640,c.y+88,15,C.yellow,'700','center');
  const rows=[['Dosare duse la bănci',fmt(G.delivered)],['Produse deblocate',G.unlocked.length+' din '+PORDER.length],['Asistenți',String(G.assist.length)],['Comision strâns','€'+fmt(G.earned)],['Salarii plătite','€'+fmt(G.salaries)]];
  rows.forEach((r,i)=>{const y=c.y+130+i*30;txt(r[0],c.x+44,y,15,'rgba(255,255,255,.82)','600','left');txt(r[1],c.x+c.w-44,y,16,'#fff','800','right','alphabetic',true);
    if(i<rows.length-1){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(c.x+44,y+10,c.w-88,1)}});
  const go=PAUSE.go;rr(go.x,go.y+4,go.w,go.h,28);ctx.fillStyle='#a85f00';ctx.fill();rr(go.x,go.y,go.w,go.h,28);ctx.fillStyle=C.yellow;ctx.fill();
  txt('Continuă',go.x+go.w/2,go.y+go.h/2+1,22,'#04380f','800','center','middle',true);
  const ct=PAUSE.cta;rr(ct.x,ct.y,ct.w,ct.h,22);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();
  txt('Aplică în rețeaua 123Credit',ct.x+ct.w/2,ct.y+ct.h/2+1,16,'#fff','700','center','middle');
  const ag=PAUSE.again;txt('Repornește jocul',ag.x+ag.w/2,ag.y+ag.h/2+1,13,'rgba(255,255,255,.65)','600','center','middle');
}

function drawEnd(){
  const a=clamp(G.endT/.5,0,1),e=easeOutBack(a);
  ctx.fillStyle='rgba(2,24,8,'+(.8*Math.min(1,G.endT/.4))+')';ctx.fillRect(0,0,W,H);
  const c=END.card;
  ctx.save();ctx.translate(640,360);ctx.scale(lerp(.86,1,e),lerp(.86,1,e));ctx.translate(-640,-360);ctx.globalAlpha=a;
  shadowed(()=>{rr(c.x,c.y,c.w,c.h,30);const gr=ctx.createLinearGradient(0,c.y,0,c.y+c.h);gr.addColorStop(0,'#05951f');gr.addColorStop(1,'#04380f');ctx.fillStyle=gr;ctx.fill()},34,12,.45);
  rr(c.x,c.y,c.w,c.h,30);ctx.lineWidth=4;ctx.strokeStyle=C.yellow;ctx.stroke();
  const Y=c.y;
  if(logoReady)ctx.drawImage(logoImg,640-56,Y+18,111,40);
  fitTxt('Ești gata să fii broker pe bune?',640,Y+106,640,38,'#fff','800','center',true);
  const n=G.delivered,de=(n%100>=20||n%100===0)?' de':'';
  wrap('Ai dus '+n+de+' dosare la bănci și ai ajuns Hub Manager în joc. Aplică să faci parte din rețeaua 123Credit.',640,Y+154,620,28,19,'rgba(255,255,255,.92)','600','center');
  [['Dosare duse',fmt(n)],['Produse deblocate',G.unlocked.length+' din '+PORDER.length],['Asistenți',String(G.assist.length)]].forEach((r,i)=>{
    const x=324+i*216;rr(x,Y+216,200,56,16);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill();
    txt(r[1],x+100,Y+237,22,C.yellow,'800','center','middle',true);txt(r[0],x+100,Y+258,12,'rgba(255,255,255,.82)','600','center','middle')});
  const b=END.cta,pul=1+.02*Math.sin(performance.now()/260);
  ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.scale(pul,pul);ctx.translate(-b.w/2,-b.h/2);
  rr(0,5,b.w,b.h,31);ctx.fillStyle='#a85f00';ctx.fill();rr(0,0,b.w,b.h,31);ctx.fillStyle=C.yellow;ctx.fill();
  txt('Aplică acum',b.w/2,b.h/2+1,26,'#04380f','800','center','middle',true);ctx.restore();
  txt('Joacă din nou',640,Y+364,15,'rgba(255,255,255,.85)','700','center','middle');
  ctx.restore();
}

function render(){
  const w=cv.width,h=cv.height;
  mainCtx.setTransform(1,0,0,1,0,0);mainCtx.fillStyle='#03450f';mainCtx.fillRect(0,0,w,h);
  mainCtx.setTransform(scale*dpr,0,0,scale*dpr,ox*dpr,oy*dpr);
  ctx=mainCtx;ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.drawImage(bg,0,0,W,H);
  drawWall();drawZone();drawCash();drawPads();drawHint(false);drawEntities();drawFx();drawHint(true);drawJoy();drawToast();drawHUD();
  if(G.cel)drawCelebration();
  if(G.over)drawEnd();
  if(G.paused)drawPause();
  ctx.restore();
}

/* ───────────── START ───────────── */
function startGame(){
  const name=(document.getElementById('nm').value||'').trim().slice(0,14)||'Broker';
  try{localStorage.setItem('bt_name',name)}catch(e){}
  newGame(name);G.mode='play';
  document.getElementById('intro').classList.add('hide');unlockAudio();
}
document.getElementById('go').addEventListener('click',startGame);
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
try{const n=localStorage.getItem('bt_name');if(n)document.getElementById('nm').value=n}catch(e){}

/* ───────────── LOOP ───────────── */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let acc=dt*CONFIG.SPEED;
  while(acc>1e-6){const s=Math.min(acc,1/30);step(s);acc-=s}
  render();requestAnimationFrame(frame);
}
newGame();buildBG();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('800 16px "Encode Sans"'),document.fonts.load('700 16px "Inter"')]).then(buildBG).catch(()=>{})}
if(CONFIG.SKIP){document.getElementById('nm').value=Q.get('name')||'Ovidiu';startGame()}
else setTimeout(()=>{try{document.getElementById('nm').focus()}catch(e){}},50);
if(CONFIG.DEBUG){
  window.__state=()=>G;
  window.__tick=(sec=1,draw=true)=>{let a=sec;while(a>1e-6){const s=Math.min(a,1/30);step(s);a-=s}if(draw)render()};
  window.__render=render;
}
requestAnimationFrame(frame);
})();
</script>
